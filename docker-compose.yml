services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkpay}
      POSTGRES_DB: ${POSTGRES_DB:-arkpay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arkpay-pgdata:/var/lib/postgresql/data

volumes:
  arkpay-pgdata:
